<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 3 - Array & Objek</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 p-8">
    <h1 class="text-2xl font-bold mb-4">
      Latihan 3: Array & Objek (CRUD Mahasiswa)
    </h1>
    <div id="result" class="space-y-4"></div>

    <!-- Form CRUD -->
    <div class="p-4 bg-blue-50 rounded border mt-4">
      <h2 class="font-bold mb-2">Form Mahasiswa</h2>
      <input type="hidden" id="edit-index" value="-1" />
      <div class="flex gap-2 flex-wrap mb-2">
        <input
          type="text"
          id="input-nama"
          placeholder="Nama"
          class="border p-2 rounded"
        />
        <input
          type="text"
          id="input-nim"
          placeholder="NIM"
          class="border p-2 rounded"
        />
        <input
          type="text"
          id="input-jurusan"
          placeholder="Jurusan"
          class="border p-2 rounded"
        />
        <input
          type="number"
          id="input-nilai"
          placeholder="Nilai (0-100)"
          class="border p-2 rounded"
        />
      </div>
      <div class="flex gap-2">
        <button
          id="btn-tambah"
          class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
        >
          Tambah
        </button>
        <button
          id="btn-update"
          class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
          disabled
        >
          Update
        </button>
        <button
          id="btn-sort-asc"
          class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        >
          Sort A-Z
        </button>
        <button
          id="btn-sort-desc"
          class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800"
        >
          Sort Z-A
        </button>
      </div>
      <div id="pesan-form" class="mt-2"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
